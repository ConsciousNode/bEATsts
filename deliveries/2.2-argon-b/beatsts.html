function toGba15(hex) {
  const r = parseInt(hex.slice(1,3), 16) & 0xF8;
  const g = parseInt(hex.slice(3,5), 16) & 0xF8;
  const b = parseInt(hex.slice(5,7), 16) & 0xF8;
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

// Type-based 8-move level-up learnset builder from authored primary/secondary types + signature moves
const TYPE_MOVE_POOLS = {
  Toasted:   [0, 51, 3, 52, 1, 56, 53, 2, 4, 54],
  Steamed:   [5, 61, 57, 62, 6, 58, 7, 59, 8, 60],
  Fried:     [10, 66, 13, 63, 68, 11, 64, 65, 12, 67],
  Pickled:   [14, 69, 70, 15, 73, 74, 71, 16, 72, 17],
  Spicy:     [18, 75, 80, 21, 78, 19, 77, 76, 20, 79],
  Brothy:    [22, 81, 85, 25, 83, 23, 86, 82, 24, 84],
  Raw:       [26, 87, 89, 28, 88, 27, 91, 29, 90, 92],
  Fermented: [30, 93, 33, 96, 95, 31, 94, 32, 97, 98],
  Sweet:     [34, 99, 36, 100, 35, 101, 104, 37, 102, 103],
  Savory:    [38, 105, 106, 39, 110, 107, 108, 40, 41, 109],
  Chilled:   [42, 111, 45, 116, 43, 113, 112, 44, 114, 115],
  Herbal:    [46, 117, 122, 118, 47, 120, 119, 48, 123, 50, 121]
};

function buildLearnset(types, baseMoves) {
  const seen = new Set(baseMoves);
  const pool = [...baseMoves];
  for (const t of types) {
    for (const m of (TYPE_MOVE_POOLS[t] || [])) {
      if (!seen.has(m)) { seen.add(m); pool.push(m); }
    }
  }
  // Ensure at least 8 moves with progressive levels: 1, 1, 5, 9, 14, 20, 27, 35

const TYPE_PALETTE_ACCENTS = {
  Toasted:   ['#E8A850', '#B86820', '#F8D890'],
  Steamed:   ['#F0F8F8', '#B8D8E0', '#FFFFFF'],
  Fried:     ['#F0C040', '#C08018', '#FFF0A0'],
  Pickled:   ['#98D830', '#589018', '#D0F880'],
  Spicy:     ['#F04030', '#A81818', '#FF9850'],
  Brothy:    ['#5090C8', '#285888', '#A8D8F8'],
  Raw:       ['#60C878', '#288048', '#B0F0B8'],
  Fermented: ['#A868E0', '#683098', '#D8B0F8'],
  Sweet:     ['#FF88B8', '#C84880', '#FFD0E8'],
  Savory:    ['#A86848', '#683820', '#D8A880'],
  Chilled:   ['#60D8F8', '#2890C0', '#D0F8FF'],
  Herbal:    ['#389860', '#185838', '#88E0A0']
};

function buildSpeciesPalette(sp) {
  const t1 = TYPE_PALETTE_ACCENTS[sp.types[0]] || TYPE_PALETTE_ACCENTS.Savory;
  const t2 = TYPE_PALETTE_ACCENTS[sp.types[1] || sp.types[0]] || t1;
  const raw = [
    null,
    '#181820', // 1: outline
    t1[0],    // 2: primary
    t1[1],    // 3: primary shadow
    t1[2],    // 4: primary highlight
    t2[0],    // 5: secondary
    t2[1],    // 6: secondary shadow
    t2[2],    // 7: secondary highlight
    '#F8F8F0', // 8: white
    '#F0C868', // 9: crust / noodle gold
    '#D04038', // 10: tomato / chili
    '#50B848', // 11: herb / lettuce
    '#F8E888', // 12: cheese / butter / glow
    '#885030', // 13: wood / pot dark
    '#C0C8D0', // 14: ceramic / steel
    '#FF90A8'  // 15: cheek / sweet accent
  ];
  return raw.map(c => c ? toGba15(c) : null);
}

function makeGrid32() { return new Uint8Array(32 * 32); }
function setPx32(g, x, y, c) {
  const ix = Math.round(x), iy = Math.round(y);
  if (ix >= 0 && ix < 32 && iy >= 0 && iy < 32) g[iy * 32 + ix] = c;
}
function fillRect32(g, x0, y0, w, h, c) {
  for (let y = y0; y < y0 + h; y++)
    for (let x = x0; x < x0 + w; x++) setPx32(g, x, y, c);
}
function fillEllipse32(g, cx, cy, rx, ry, c) {
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1.0) setPx32(g, x, y, c);
    }
  }
}
function outlineGrid32(g, outlineIdx = 1) {
  const copy = new Uint8Array(g);
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 32; x++) {
      if (copy[y * 32 + x] !== 0) continue;
      const n = (y > 0 && copy[(y-1)*32+x]) || (y < 31 && copy[(y+1)*32+x]) ||
                (x > 0 && copy[y*32+(x-1)]) || (x < 31 && copy[y*32+(x+1)]);
      if (n) g[y * 32 + x] = outlineIdx;
    }
  }
}

function drawBeatstSprite32(sp, isBack) {
  const g = makeGrid32();
  const sh = sp.shape;
  const s = sh.sizeMod; // 0 (small), 1 (med), 2 (large)
  let cx = 16, cy = 17 - s;
  if (sh.pose === 'high') cy -= 4;
  else if (sh.pose === 'low') cy += 4;
  else if (sh.pose === 'left') cx -= 5;
  else if (sh.pose === 'right') cx += 5;
  else if (sh.pose === 'lean_l') { cx -= 4; cy -= 3; }
  else if (sh.pose === 'lean_r') { cx += 4; cy += 3; }
  else if (sh.pose === 'wide') { cy += 2; fillRect32(g, cx - 13, cy + 1, 26, 3, 2); }
  else if (sh.pose === 'tall') { cy -= 3; fillRect32(g, cx - 4, cy - 10, 8, 6, 2); }

  // 1. Arch-specific 32x32 body silhouette (authored per-species, zero ID arithmetic)
  switch (sh.arch) {
    case 'slice': {
      const w = 12 + s * 3, h = 11 + s * 2;
      fillRect32(g, cx - Math.floor(w/2), cy - Math.floor(h/2), w, 3, 9);
      fillRect32(g, cx - Math.floor(w/2) - 1, cy - Math.floor(h/2) + 3, w + 2, 2, 11);
      fillRect32(g, cx - Math.floor(w/2), cy - Math.floor(h/2) + 5, w, 2, 5);
      fillRect32(g, cx - Math.floor(w/2), cy - Math.floor(h/2) + 7, w, h - 7, 9);
      break;
    }
    case 'club': {
      const w = 13 + s * 2;
      for (let r = 0; r < 14 + s * 2; r++) {
        const rw = Math.max(4, Math.floor((r + 2) * w / (15 + s * 2)));
        fillRect32(g, cx - Math.floor(rw / 2), 6 + r, rw, 1, r % 4 === 0 ? 9 : (r % 4 === 1 ? 11 : (r % 4 === 2 ? 10 : 5)));
      }
      break;
    }
    case 'sub': {
      fillEllipse32(g, cx, cy + 1, 11 + s * 2, 4 + s, 9);
      fillRect32(g, cx - 9 - s, cy, 18 + s * 2, 2, 11);
      fillRect32(g, cx - 8 - s, cy + 1, 16 + s * 2, 2, 5);
      break;
    }
    case 'burger': {
      const r = 7 + s * 2;
      fillEllipse32(g, cx, cy - 3, r, 4 + s, 9);
      fillRect32(g, cx - r - 1, cy + 1, r * 2 + 2, 2, 12);
      fillRect32(g, cx - r, cy + 3, r * 2, 2, 13);
      fillRect32(g, cx - r + 1, cy + 5, r * 2 - 2, 3, 9);
      break;
    }
    case 'croissant': {
      fillEllipse32(g, cx, cy, 8 + s * 2, 4 + s, 9);
      fillEllipse32(g, cx - 6 - s, cy + 3, 3 + s, 3, 3);
      fillEllipse32(g, cx + 6 + s, cy + 3, 3 + s, 3, 3);
      break;
    }
    case 'pita': {
      fillEllipse32(g, cx, cy + 2, 8 + s * 2, 7 + s, 9);
      fillEllipse32(g, cx, cy - 2, 6 + s, 3, 5);
      fillRect32(g, cx - 5, cy - 3, 10, 2, 11);
      break;
    }
    case 'waffle': {
      const sz = 12 + s * 3;
      fillRect32(g, cx - Math.floor(sz/2), cy - Math.floor(sz/2), sz, sz, 9);
      for (let y = cy - Math.floor(sz/2) + 2; y < cy + Math.floor(sz/2) - 1; y += 3)
        for (let x = cx - Math.floor(sz/2) + 2; x < cx + Math.floor(sz/2) - 1; x += 3)
          setPx32(g, x, y, 3);
      break;
    }
    case 'bagel': {
      const r = 8 + s * 2;
      fillEllipse32(g, cx, cy, r, r - 1, 9);
      fillEllipse32(g, cx, cy, 2 + s, 2, 0);
      break;
    }
    case 'scone': {
      for (let r = 0; r < 12 + s * 2; r++) {
        const w = 4 + Math.floor(r * 1.1);
        fillRect32(g, cx - Math.floor(w/2), 10 + r - s, w, 1, r < 4 ? 12 : 2);
      }
      break;
    }
    case 'pretzel': {
      fillEllipse32(g, cx - 4, cy - 2, 5 + s, 5 + s, 9);
      fillEllipse32(g, cx + 4, cy - 2, 5 + s, 5 + s, 9);
      fillEllipse32(g, cx, cy + 3, 7 + s, 4, 13);
      fillEllipse32(g, cx - 4, cy - 2, 2, 2, 0);
      fillEllipse32(g, cx + 4, cy - 2, 2, 2, 0);
      break;
    }
    case 'muffin': {
      fillEllipse32(g, cx, cy - 2, 8 + s * 2, 5 + s, 9);
      fillRect32(g, cx - 6 - s, cy + 2, 12 + s * 2, 5 + s, 13);
      break;
    }
    case 'taco_open': {
      fillEllipse32(g, cx, cy + 2, 10 + s * 2, 5 + s, 12);
      fillRect32(g, cx - 8 - s, cy - 1, 16 + s * 2, 3, 10);
      fillRect32(g, cx - 7 - s, cy - 2, 14 + s * 2, 2, 11);
      break;
    }
    case 'bao': {
      fillEllipse32(g, cx, cy + 1, 8 + s * 2, 7 + s * 2, 2);
      fillEllipse32(g, cx, cy - 5 - s, 3 + s, 2 + s, 4);
      break;
    }
    case 'gyoza': {
      fillEllipse32(g, cx, cy + 2, 10 + s * 2, 5 + s, 2);
      fillRect32(g, cx - 9 - s, cy + 6 + s, 18 + s * 2, 2, 9);
      for (let x = cx - 6; x <= cx + 6; x += 3) setPx32(g, x, cy - 3 - s, 4);
      break;
    }
    case 'shumai': {
      fillRect32(g, cx - 6 - s, cy - 3, 12 + s * 2, 10 + s, 9);
      fillEllipse32(g, cx, cy - 3, 6 + s, 3, 5);
      setPx32(g, cx, cy - 4, 11); setPx32(g, cx + 1, cy - 4, 11);
      break;
    }
    case 'onigiri': {
      for (let r = 0; r < 13 + s * 2; r++) {
        const w = 3 + Math.floor(r * 1.15);
        fillRect32(g, cx - Math.floor(w/2), 8 + r - s, w, 1, 8);
      }
      fillRect32(g, cx - 4, 15, 8, 6 + s, 1);
      break;
    }
    case 'ravioli': {
      const sz = 12 + s * 2;
      fillRect32(g, cx - Math.floor(sz/2), cy - Math.floor(sz/2), sz, sz, 9);
      fillEllipse32(g, cx, cy, 4 + s, 4 + s, 2);
      break;
    }
    case 'empanada': {
      fillEllipse32(g, cx, cy + 1, 9 + s * 2, 6 + s, 9);
      fillRect32(g, cx - 8 - s, cy + 1, 16 + s * 2, 2, 3);
      break;
    }
    case 'mochi': {
      fillEllipse32(g, cx, cy + 2, 7 + s * 2, 6 + s, 2);
      fillEllipse32(g, cx - 2, cy, 3 + s, 2, 4);
      break;
    }
    case 'khinkali': {
      fillEllipse32(g, cx, cy + 3, 8 + s * 2, 6 + s, 2);
      for (let r = 0; r < 5 + s; r++) fillRect32(g, cx - 2 - Math.floor(r/2), cy - 5 - s + r, 4 + r, 1, 4);
      break;
    }
    case 'takoyaki': {
      fillEllipse32(g, cx, cy, 7 + s * 2, 7 + s * 2, 9);
      fillEllipse32(g, cx, cy - 4 - s, 5 + s, 2, 13);
      break;
    }
    case 'burek': {
      fillEllipse32(g, cx, cy + 1, 9 + s * 2, 6 + s * 2, 9);
      fillEllipse32(g, cx, cy + 1, 5 + s, 3 + s, 3);
      fillEllipse32(g, cx, cy + 1, 2, 1, 4);
      break;
    }
    case 'ramen': {
      fillEllipse32(g, cx, cy + 3, 9 + s * 2, 5 + s, 14);
      fillRect32(g, cx - 8 - s, cy - 1, 16 + s * 2, 4, 14);
      fillEllipse32(g, cx, cy - 2, 8 + s, 3 + s, 9);
      break;
    }
    case 'pho': {
      fillEllipse32(g, cx, cy + 4, 7 + s * 2, 4 + s, 8);
      fillRect32(g, cx - 7 - s, cy - 2, 14 + s * 2, 6, 8);
      fillEllipse32(g, cx, cy - 3, 7 + s, 3, 5);
      for (let i = 0; i < 6; i++) { setPx32(g, cx + 3 + i, cy - 8 + i, 13); }
      break;
    }
    case 'pasta_nest': {
      fillEllipse32(g, cx, cy + 1, 9 + s * 2, 6 + s, 9);
      fillEllipse32(g, cx, cy - 1, 5 + s, 3, 10);
      break;
    }
    case 'wok_pan': {
      fillEllipse32(g, cx, cy + 2, 10 + s * 2, 5 + s, 1);
      fillRect32(g, cx + 9 + s, cy, 5, 2, 13);
      fillEllipse32(g, cx, cy - 1, 8 + s, 3, 9);
      break;
    }
    case 'lasagna': {
      const w = 14 + s * 3, h = 10 + s * 2;
      fillRect32(g, cx - Math.floor(w/2), cy - Math.floor(h/2), w, h, 9);
      fillRect32(g, cx - Math.floor(w/2), cy - 2, w, 2, 10);
      fillRect32(g, cx - Math.floor(w/2), cy + 2, w, 2, 12);
      break;
    }
    case 'noodle_drake': {
      fillEllipse32(g, cx - 3, cy - 3, 5 + s, 4 + s, 9);
      fillEllipse32(g, cx + 3, cy + 2, 6 + s, 4 + s, 12);
      fillEllipse32(g, cx - 2, cy + 5, 5 + s, 3, 9);
      break;
    }
    case 'mac_cup': {
      fillRect32(g, cx - 6 - s, cy - 2, 12 + s * 2, 10 + s, 14);
      fillEllipse32(g, cx, cy - 3, 6 + s, 3 + s, 12);
      break;
    }
    case 'soba_mat': {
      fillRect32(g, cx - 10 - s, cy + 2, 20 + s * 2, 5, 13);
      fillEllipse32(g, cx, cy - 1, 7 + s, 4 + s, 3);
      break;
    }
    case 'teacup': {
      fillEllipse32(g, cx, cy + 2, 6 + s * 2, 5 + s, 8);
      fillRect32(g, cx - 6 - s, cy - 3, 12 + s * 2, 5, 8);
      fillEllipse32(g, cx, cy - 3, 5 + s, 2, 5);
      fillRect32(g, cx + 6 + s, cy - 1, 3, 4, 8);
      break;
    }
    case 'cauldron': {
      fillEllipse32(g, cx, cy + 2, 9 + s * 2, 7 + s, 13);
      fillRect32(g, cx - 7 - s, cy - 5, 14 + s * 2, 3, 14);
      fillEllipse32(g, cx, cy - 5, 6 + s, 2, 5);
      break;
    }
    case 'bread_bowl': {
      fillEllipse32(g, cx, cy + 2, 9 + s * 2, 6 + s, 9);
      fillEllipse32(g, cx, cy - 2, 6 + s, 3, 5);
      break;
    }
    case 'tureen': {
      fillEllipse32(g, cx, cy + 1, 8 + s * 2, 6 + s, 14);
      fillRect32(g, cx - 6 - s, cy - 5, 12 + s * 2, 3, 8);
      fillEllipse32(g, cx, cy - 6, 4 + s, 2, 12);
      break;
    }
    case 'clay_pot': {
      fillEllipse32(g, cx, cy + 2, 8 + s * 2, 6 + s, 10);
      fillEllipse32(g, cx, cy - 3, 6 + s, 2, 5);
      break;
    }
    case 'chili_pot': {
      fillRect32(g, cx - 7 - s, cy - 4, 14 + s * 2, 11 + s, 10);
      fillEllipse32(g, cx, cy - 4, 7 + s, 3, 5);
      break;
    }
    case 'myth_bowl': {
      fillEllipse32(g, cx, cy + 2, 10 + s * 2, 6 + s, 12);
      fillEllipse32(g, cx, cy - 3, 8 + s, 3, 5);
      fillRect32(g, cx - 4, cy + 7 + s, 8, 3, 12);
      break;
    }
  }

  // 2. Toppers / Headgear
  switch (sh.top) {
    case 'flag': fillRect32(g, cx, 3, 1, 6, 13); fillRect32(g, cx + 1, 3, 5, 3, 10); break;
    case 'grill': fillRect32(g, cx - 5, 6, 10, 2, 1); break;
    case 'skewer': fillRect32(g, cx, 2, 2, 7, 13); fillEllipse32(g, cx + 1, 3, 2, 2, 11); break;
    case 'leaf': fillEllipse32(g, cx - 2, 6, 3, 2, 11); fillEllipse32(g, cx + 3, 5, 3, 2, 11); break;
    case 'periscope': fillRect32(g, cx - 1, 3, 2, 6, 14); fillRect32(g, cx - 1, 3, 5, 2, 14); break;
    case 'drip': fillRect32(g, cx - 5, 7, 10, 2, 15); setPx32(g, cx - 3, 9, 15); setPx32(g, cx + 2, 10, 15); break;
    case 'crown': fillRect32(g, cx - 5, 5, 10, 3, 12); setPx32(g, cx - 4, 4, 12); setPx32(g, cx, 3, 10); setPx32(g, cx + 4, 4, 12); break;
    case 'dill': fillRect32(g, cx - 3, 4, 2, 4, 11); fillRect32(g, cx + 2, 4, 2, 4, 11); break;
    case 'horns': fillRect32(g, cx - 7, 4, 2, 4, 8); fillRect32(g, cx + 5, 4, 2, 4, 8); break;
    case 'sugar': fillRect32(g, cx - 4, 6, 8, 2, 8); break;
    case 'ears': fillEllipse32(g, cx - 5, 6, 2, 3, 2); fillEllipse32(g, cx + 5, 6, 2, 3, 2); break;
    case 'chili': fillRect32(g, cx - 2, 4, 4, 4, 10); setPx32(g, cx, 3, 11); break;
    case 'cream': fillEllipse32(g, cx, 6, 4, 3, 8); setPx32(g, cx, 3, 10); break;
    case 'seeds': setPx32(g, cx - 3, 8, 8); setPx32(g, cx, 7, 8); setPx32(g, cx + 3, 8, 8); break;
    case 'antennae': fillRect32(g, cx - 4, 3, 1, 5, 1); fillRect32(g, cx + 4, 3, 1, 5, 1); break;
    case 'moon': fillEllipse32(g, cx, 5, 3, 3, 12); fillEllipse32(g, cx + 1, 5, 2, 2, 0); break;
    case 'egg': fillEllipse32(g, cx, 6, 4, 3, 8); fillEllipse32(g, cx, 6, 2, 2, 12); break;
    case 'knot': fillEllipse32(g, cx, 6, 3, 2, 4); break;
    case 'steam': setPx32(g, cx - 4, 4, 8); setPx32(g, cx - 3, 2, 8); setPx32(g, cx + 4, 4, 8); setPx32(g, cx + 5, 2, 8); break;
    case 'pleat': for (let x = cx - 5; x <= cx + 5; x += 2) setPx32(g, x, 6, 8); break;
    case 'flame': fillEllipse32(g, cx, 5, 3, 4, 10); fillEllipse32(g, cx, 6, 2, 2, 12); break;
    case 'halo': fillEllipse32(g, cx, 4, 7, 2, 12); fillEllipse32(g, cx, 4, 5, 1, 0); break;
  }

  // 3. Limbs
  switch (sh.limb) {
    case 'stub': fillRect32(g, cx - 6, 25, 3, 3, 3); fillRect32(g, cx + 3, 25, 3, 3, 3); break;
    case 'paws': fillEllipse32(g, cx - 6, 26, 3, 2, 3); fillEllipse32(g, cx + 6, 26, 3, 2, 3); break;
    case 'heavy': fillRect32(g, cx - 8, 24, 5, 5, 13); fillRect32(g, cx + 3, 24, 5, 5, 13); break;
    case 'fins': fillEllipse32(g, cx - 9, 24, 4, 2, 5); fillEllipse32(g, cx + 9, 24, 4, 2, 5); break;
    case 'arms': fillRect32(g, cx - 12, 16, 3, 5, 2); fillRect32(g, cx + 9, 16, 3, 5, 2); fillRect32(g, cx - 6, 25, 3, 3, 3); fillRect32(g, cx + 3, 25, 3, 3, 3); break;
    case 'bounce': fillEllipse32(g, cx, 27, 6, 2, 3); break;
    case 'claws': fillRect32(g, cx - 13, 14, 4, 4, 10); fillRect32(g, cx + 9, 14, 4, 4, 10); fillRect32(g, cx - 6, 25, 3, 3, 3); fillRect32(g, cx + 3, 25, 3, 3, 3); break;
    case 'float': break;
    case 'none': break;
  }

  // 4. Side appendages
  switch (sh.side) {
    case 'tail': fillEllipse32(g, cx + 11, 20, 3, 2, 5); fillEllipse32(g, cx + 13, 18, 2, 2, 12); break;
    case 'cape': fillRect32(g, cx - 12, 13, 3, 11, 10); fillRect32(g, cx + 9, 13, 3, 11, 10); break;
    case 'wings': fillEllipse32(g, cx - 12, 14, 3, 5, 4); fillEllipse32(g, cx + 12, 14, 3, 5, 4); break;
    case 'shield': fillEllipse32(g, cx - 12, 18, 3, 5, 14); break;
    case 'aura': setPx32(g, 3, 12, 12); setPx32(g, 28, 12, 12); setPx32(g, 4, 22, 8); setPx32(g, 27, 22, 8); break;
    case 'fins': fillEllipse32(g, cx - 12, 17, 3, 3, 5); fillEllipse32(g, cx + 12, 17, 3, 3, 5); break;
    case 'arms': fillRect32(g, cx - 12, 15, 3, 5, 6); fillRect32(g, cx + 9, 15, 3, 5, 6); break;
    case 'claws': fillRect32(g, cx - 12, 12, 3, 3, 10); fillRect32(g, cx + 9, 12, 3, 3, 10); break;
  }

  // Pose-specific body proportion accents
  if (sh.pose === 'wide') { fillRect32(g, cx - 10, cy + 2, 20, 2, 3); }
  if (sh.pose === 'tall') { fillRect32(g, cx - 3, cy - 8, 6, 3, 4); }
  // 5. Front eyes vs Back rear detail
  if (!isBack) {
    const ey = cy;
    fillRect32(g, cx - 4, ey - 1, 2, 3, 1); setPx32(g, cx - 4, ey - 1, 8);
    fillRect32(g, cx + 2, ey - 1, 2, 3, 1); setPx32(g, cx + 2, ey - 1, 8);
    setPx32(g, cx - 6, ey + 2, 15); setPx32(g, cx + 5, ey + 2, 15);
    setPx32(g, cx - 1, ey + 2, 1); setPx32(g, cx, ey + 3, 1); setPx32(g, cx + 1, ey + 2, 1);
  } else {
    fillRect32(g, cx - 3, cy - 1, 6, 4, 6);
    fillRect32(g, cx - 2, cy, 4, 2, 3);
  }

  outlineGrid32(g, 1);
  return g;
}

function buildCharSpriteGrid(spriteKey, dir = 'down', walkFrame = 0) {
  const pal = CHAR_SPRITES[spriteKey] || CHAR_SPRITES.villager_0;
  const grid = Array(16 * 24).fill(null);
  const px = (x, y, c) => { if (x >= 0 && x < 16 && y >= 0 && y < 24) grid[y * 16 + x] = c; };
  const rect = (x0, y0, w, h, c) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) px(x, y, c); };

  if (pal.hatStyle === 'chest') {
    rect(2, 9, 12, 11, '#181820');
    rect(3, 10, 10, 4, '#F0C040');

    rect(7, 13, 2, 3, '#F8F8F0');

    rect(1, 8, 14, 14, '#181820');
    rect(2, 9, 12, 12, '#D8B880');
    rect(4, 11, 8, 8, '#885030');

    px(4, hy - 1, pal.hat); px(7, hy - 2, pal.hat); px(11, hy - 1, pal.hat);
  } else if (pal.hatStyle === 'twin_buns') {
    rect(2, hy, 2, 3, pal.hat); rect(12, hy, 2, 3, pal.hat);

    rect(2, hy + 3, 12, 2, pal.hat);

    rect(4, hy - 2, 7, 3, pal.hat); rect(9, hy - 3, 3, 2, pal.hat);

    px(3, hy + 1, '#F0C040'); px(12, hy + 1, '#F0C040'); px(2, hy + 2, '#F0C040'); px(13, hy + 2, '#F0C040');
  } else if (pal.hatStyle === 'bun_hat') {
    rect(5, hy - 2, 6, 3, pal.hat); px(7, hy - 3, '#F8F8F0');

  } else if (dir === 'right') {
    px(10, hy + 6, '#181820');
  } else {
    rect(5, hy + 5, 6, 4, pal.hat);
  }

  // Torso / Coat / Cloak
  const ty = hy + 9;
  rect(3, ty, 10, 7, '#181820');
  rect(4, ty + 1, 8, 5, pal.shirt);
  if (pal.acc === 'apron') rect(5, ty + 2, 6, 4, '#F8F8F0');
  else if (pal.acc === 'scarf') rect(4, ty + 1, 8, 2, '#F0C040');
  else if (pal.acc === 'tie') rect(7, ty + 1, 2, 4, '#E63946');
  else if (pal.acc === 'sash') { px(5, ty + 1, '#F0C040'); px(6, ty + 2, '#F0C040'); px(7, ty + 3, '#F0C040'); }
  else if (pal.acc === 'cloak') { rect(2, ty + 1, 2, 7, pal.hat); rect(12, ty + 1, 2, 7, pal.hat); }
  else if (pal.acc === 'vest') { rect(4, ty + 1, 2, 5, pal.hat); rect(10, ty + 1, 2, 5, pal.hat); }
  else if (pal.acc === 'collar') { px(5, ty + 1, '#F8F8F0'); px(10, ty + 1, '#F8F8F0'); }
  else if (pal.acc === 'jacket') { rect(6, ty + 1, 4, 5, '#F8F8F0'); }
  else if (pal.acc === 'robe') { rect(4, ty + 4, 8, 3, pal.shirt); }
  else if (pal.acc === 'ribbon') { rect(6, ty + 2, 4, 2, '#FF70A6'); }

  // Arms (swing with walkFrame)
  const armOff = walkFrame === 1 ? -1 : (walkFrame === 2 ? 1 : 0);
  rect(2, ty + 1 + armOff, 2, 4, pal.shirt);
  rect(12, ty + 1 - armOff, 2, 4, pal.shirt);

  // Legs (2+ walk frames)
  const ly = ty + 6;
  if (walkFrame === 0) {
    rect(4, ly, 3, 4, pal.pants);
    rect(9, ly, 3, 4, pal.pants);
  } else if (walkFrame === 1) {
    rect(4, ly - 1, 3, 4, pal.pants);
    rect(9, ly + 1, 3, 4, pal.pants);
  } else {
    rect(4, ly + 1, 3, 4, pal.pants);
    rect(9, ly - 1, 3, 4, pal.pants);
  }
  return grid;
}

function drawCharSprite16(ctx, spriteKey, dir, dx, dy, walkFrame = 0) {
  const grid = buildCharSpriteGrid(spriteKey, dir, walkFrame);
  for (let y = 0; y < 24; y++) {
    for (let x = 0; x < 16; x++) {
      const c = grid[y * 16 + x];
      if (c) {
        ctx.fillStyle = c;
        ctx.fillRect(dx + x, dy + y, 1, 1);
      }
    }
  }
}

function calcPlatingChance(species, curHp, maxHp, status, usedFavTreat, isNight, plateItem) {
  if (!species || !plateItem || plateItem.kind !== 'plate') return 0;
  if (species.nightOnly && !isNight) return 0;
  if (species.minTier && plateItem.tier < species.minTier) return 0;
  const hpFactor = Math.max(0.1, (3 * maxHp - 2 * curHp) / (3 * maxHp));
  const statusBonus = status === 'Appetized' ? 1.5 : (status ? 1.3 : 1.0);
  const favBonus = usedFavTreat ? 1.6 : 1.0;
  const timeBonus = (species.nightOnly && isNight) ? 1.35 : 1.0;
  const raw = species.catchRate * plateItem.plateBonus * hpFactor * statusBonus * favBonus * timeBonus;
  return Math.min(0.95, Math.max(0, raw));
}

nty percent better."]}, {"id": "npc_cruston_town_3", "x": 31, "y": 10, "name": "Botanist Lola", "sprite": "villager_3", "dir": "right", "lines": ["The secret to a club sandwich that doesn't slide apart on the first bite is alternating lettuce and cheese as friction layers.", "I dropped a whole wheel of aged gruyere down the cellar stairs last winter and honestly the bruising improved the nutty finish.", "Rye caraway seeds get stuck in my teeth every single morning and I still refuse to switch to white toast."], "nightLines": ["A croissant with fewer than twenty-seven distinct butter layers is just a crescent-shaped dinner roll pretending to be French."]}, {"id": "npc_cruston_town_4", "x": 30, "y": 13, "name": "Angler Toby", "sprite": "villager_4", "dir": "down", "lines": ["We brush our pretzel dough with a baking soda bath before salting so the crust turns deep mahogany.", "Nothing humbles a proud baker faster than forgetting the salt in a twelve-loaf batch of ciabatta.", "When the bakery vents open at five in the morning, half the wild bEATsts on the trail wander up to the fence."], "nightLines": ["Toastwood trees drop acorns that smell faintly of nutmeg when roasted over an open campfire."]}], "signs": [{"x": 14, "y": 2, "text": "North: Toastwood Trail"}, {"x": 10, "y": 7, "text": "Chef Brotholomew Lab"}, {"x": 22, "y": 7, "text": "Cruston Simmer Inn"}]}, "toastwood_trail": {"id": "toastwood_trail", "name": "Toastwood Trail", "region": "Breadlands", "music": "overworld_bread", "w": 32, "h": 24, "dark": false, "wildPool": [[1, 3, 5], [4, 3, 6], [6, 4, 7], [10, 4, 7], [14, 5, 8], [26, 4, 7], [25, 6, 9]], "grid": [14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 12, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 14, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 12, 12, 12, 12, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 14, 14, 10, 11, 11, 11, 11, 11, 11, 11, 11, 11, 11, 11, 10, 12, 12, 12, 12, 10, 65, 65, 65, 65, 65, 65, 65, ": "villager_8", "dir": "down", "lines": ["Onigiri rice must be salted on your wet palms, never mixed into the pot, or the grains lose their gloss.", "Wrapping crisp nori around an onigiri right before eating keeps the seaweed from turning chewy.", "Pickled umeboshi plum inside a rice ball wakes you up faster than two cups of espresso."], "nightLines": ["Khinkali topknots are meant to be held like a handle and left on the plate so everyone can count how many you ate."]}, {"id": "npc_pierogi_pier_2", "x": 13, "y": 10, "name": "Brewer Rosa", "sprite": "villager_9", "dir": "up", "lines": ["Cracking fresh black pepper over the first sip of khinkali juice is practically a law in the eastern mountains.", "Gnocchi dough should be handled as little as possible; overwork the potato and you're boiling rubber erasers.", "Baking russet potatoes in a bed of rock salt draws out excess moisture so your gnocchi need barely any flour."], "nightLines": ["Rolling gnocchi down the tines of a dinner fork creates little ridges that hold onto sage brown butter."]}, {"id": "npc_pierogi_pier_3", "x": 18, "y": 12, "name": "Chef Dante", "sprite": "villager_10", "dir": "left", "lines": ["Shumai tops stay open like little flower baskets, always crowned with a single green pea or crab roe.", "Minced shiitake stems give pork shumai a woodsy chew that balances the tender shrimp.", "Char siu bao dough uses both yeast and baking powder so the bun splits open into a snowy three-petal laugh."], "nightLines": ["Sweet roast pork glaze needs maltose and five-spice powder reduced until it coats the back of a spoon."]}, {"id": "npc_pierogi_pier_4", "x": 29, "y": 14, "name": "Baker June", "sprite": "villager_11", "dir": "right", "lines": ["Lotus leaf sticky rice packets infuse the glutinous grains with an herbal tea aroma as they steam.", "Dried shrimp, Chinese sausage, and salted egg yolk tucked inside lotus rice could power a sailor through a gale.", "Mochi pounded with a wooden mallet in a stone mortar h tLines": ["Catupiry soft cheese inside a fried coxinha stretches into strings when you pull the crust apart."]}, {"id": "npc_udon_hollow_3", "x": 29, "y": 11, "name": "Baker Mei", "sprite": "villager_11", "dir": "right", "lines": ["Burek phyllo dough is spun through the air until you can see the harbor lighthouse through the sheet.", "Coiling meat-filled phyllo into a spiral snail and baking it in a round pan guarantees every slice has crispy edges.", "Pastel dough uses a shot of cane spirit so the wrapper blisters into tiny airy bubbles when fried."], "nightLines": ["Knish dough wrapped around mashed potato and caramelized buckwheat kasha is heavy enough to anchor a rowboat."]}, {"id": "npc_udon_hollow_4", "x": 28, "y": 14, "name": "Taster Hugo", "sprite": "villager_0", "dir": "down", "lines": ["Mustard on a hot potato knish is a street-cart tradition I refuse to question.", "Tangyuan glutinous rice balls filled with black sesame paste burst like warm ink in sweet ginger soup.", "Rock sugar simmered with smashed old ginger makes the clearest, most soothing winter dessert broth."], "nightLines": ["Momo wrappers rolled thinner at the edges than the center prevent a thick doughy knot at the top."]}], "signs": [{"x": 14, "y": 19, "text": "Udon Hollow - Pull-Noodle Dojo"}]}, "slurp_canyon": {"id": "slurp_canyon", "name": "Slurp Canyon", "region": "Noodleridge", "music": "overworld_noodle", "w": 36, "h": 22, "dark": false, "wildPool": [[86, 25, 29], [88, 25, 29], [90, 26, 30], [92, 26, 30], [94, 27, 31], [95, 27, 31]], "grid": [38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 43, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 43, 43, 43, 43, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 38, 38, 34, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 34, 43, 43, 43, 43, 34, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 34, 38, 38, 34, 37, 37, 37, ted tomato and Timur pepper chutney gives steamed momos a numbing citrus kick.", "Mandu stuffed with chopped kimchi, firm tofu, and glass noodles have the best texture contrast in the bay.", "Squeezing excess brine out of chopped kimchi in cheesecloth keeps mandu wrappers from splitting on the tray."], "nightLines": ["Tortellini are shaped around the tip of your pinky finger, modeled after a sleeping cat curled by the hearth."]}, {"id": "npc_slurp_canyon_1", "x": 16, "y": 8, "name": "Chef Ivan", "sprite": "villager_10", "dir": "left", "lines": ["Serving tortellini in capon broth lets the delicate nutmeg in the filling shine without heavy cream.", "Agnolotti del plin are pinched between thumb and forefinger to trap a single drop of roast jus inside each pocket.", "Culurgiones from the islands are pleated with a wheat-ear stitch that seals in potato, pecorino, and fresh mint."], "nightLines": ["Mint and aged sheep cheese in a pasta filling sounds unusual until you taste it with simple tomato sauce."]}, {"id": "npc_slurp_canyon_2", "x": 18, "y": 10, "name": "Baker Nadia", "sprite": "villager_11", "dir": "right", "lines": ["Pierogi ruskie use farmer's quark cheese mashed into potatoes, which gives them a tangy richness cheddar can't replicate.", "Sour cherry vareniki dusted with sugar and served cold in summer stain your fingers the happiest shade of purple.", "Steamed scallion flower rolls twisted and brushed with toasted sesame oil pull apart intotwenty soft petals."], "nightLines": ["Making dumpling wrappers with boiling water denatures the gluten so you can roll them paper-thin without springback."]}, {"id": "npc_slurp_canyon_3", "x": 20, "y": 12, "name": "Taster Felix", "sprite": "villager_0", "dir": "down", "lines": ["Cold-water dumpling dough has more chew and holds up to vigorous boiling in a crowded pot.", "Always dust your wooden dumpling tray with cornstarch or semolina; plain flour turns into glue under damp dough.", "A bamboo steamer lid absorbs condensation instead of dripping water back onto your delicate buns."], "nightLines": ["When the harbor bell rings twelve times at noon, every steamer lid in Bao Harbor lifts in unison."]}, {"id": "npc_slurp_canyon_4", "x": 7, "y": 16, "name": "Botanist Mina", "sprite": "villager_1", "dir": "up", "lines": ["Seagulls around Pierogi Pier ignore fish scraps completely and hold out for buttered onion bits.", "I keep a jar of homemade chili crisp with fried garlic and fermented black beans on my belt at all times.", "Gyoza dipping sauce only needs soy, rice vinegar, and a drop of rayu chili oil--anything else is showing off."], "nightLines": ["Watching a school of Har-gaohawk glide over the cove waves at sunset is why I moved to Steambay."]}], "signs": [{"x": 15, "y": 19, "text": "Slurp Canyon -> Al Dente Ascent"}]}, "al_dente_ascent": {"id": "al_dente_ascent", "name": "Al Dente Ascent", "region": "Noodleridge", "music": "overworld_noodle", "w": 34, "h": 22, "dark": false, "wildPool": [[96, 28, 32], [97, 28, 32], [98, 29, 33], [99, 29, 33], [100, 29, 33], [101, 30, 34]], "grid": [38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 36, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 38, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 36, 36, 36, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 38, 38, 34, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 34, 34, 36, 36, 36, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 34, 38, 38, 34, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 34, 34, 36, 36, 36, 34, 34, 34, 34, 40, 40, 40, 40, 40, 40, 40, 34, 34, 34, 34, 38, 38, 34, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 34, 34, 36, 36, 36, 34, 34, 34, 34, 40, 40, 40, 40, 40, 40, 40, 34, 34, 34, 34, 38, 38, 34, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 34, 34, 36, 36, 36, 34, 34, 34, 34, 39, 8, 39, 39, 39, 8, 39, 34, 34, 34, 34, 38, 38, 34, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 34, 34, 36, 36, 36, 34, 34, 34, 34, 39, 39, 36, 2, 36 ke church bells."]}, {"id": "npc_al_dente_ascent_2", "x": 25, "y": 9, "name": "Taster Clara", "sprite": "villager_0", "dir": "down", "lines": ["The rope bridges across Slurp Canyon sway whenever a heavy Yakisobayak trots across the planks.", "VP Synergy Glaze brought a pair of scissors to the canyon to cut long longevity noodles, and the locals nearly fainted.", "Pad Thai tamarind paste should balance sour, sweet, and salty before a single crushed peanut touches the wok."], "nightLines": ["Dried shrimp and preserved radish chopped fine are the secret backbone of street-style Pad Thai."]}, {"id": "npc_al_dente_ascent_3", "x": 28, "y": 11, "name": "Botanist Vera", "sprite": "villager_1", "dir": "up", "lines": ["Never put oil in your pasta boiling water; all it does is coat the noodles so the marinara slides right off.", "Save a mug of starchy pasta water before you drain the colander--that liquid gold binds cheese and pepper into silk.", "Carbonara uses guanciale, pecorino, black pepper, and eggs tempered off the heat; cream is contraband on this mountain."], "nightLines": ["Cacio e pepe is three ingredients and a test of whether you understand starch emulsion and pan temperature."]}, {"id": "npc_al_dente_ascent_4", "x": 22, "y": 14, "name": "Angler Leon", "sprite": "villager_2", "dir": "left", "lines": ["Toast whole Tellicherry peppercorns in a dry skillet before crushing them with a heavy saucepan for cacio e pepe.", "Al Dente Ascent is steep enough that water boils two degrees cooler at the top than at the bottom.", "Nonna Fusilli shapes cavatelli against a ridged wooden board with her thumb faster than a machine."], "nightLines": ["When bronze-die extruded pasta dries slowly, its rough chalky surface grabs ragu like Velcro."]}], "signs": [{"x": 14, "y": 19, "text": "Al Dente Ascent & Wok Peak Bistro"}]}, "ramen_summit": {"id": "ramen_summit", "name": "Ramen Summit", "region": "Noodleridge", "music": "town_noodle", "w": 34, "h": 22, "dark": false, "wildPool": [[102 ive": "q15_wok", "lines": ["My forge needs a Wok Hei Spark from the crater of Wok Volcano to the west!"]}, {"id": "npc_ramen_summit_0", "x": 22, "y": 2, "name": "Baker Maya", "sprite": "villager_11", "dir": "right", "lines": ["Lasagna sheets layered with bechamel and slow-simmered bolognese need twenty minutes to settle before you cut a square.", "Spinach kneaded into fresh egg pasta sheets turns lasagna verde into a stained-glass window of flavor.", "Pesto genovese belongs in a marble mortar with pine nuts and garlic; steel blender blades heat and oxidize the sweet basil."], "nightLines": ["Blanching basil leaves fortwo seconds and icing them keeps pesto emerald green for days."]}, {"id": "npc_ramen_summit_1", "x": 22, "y": 6, "name": "Taster Paco", "sprite": "villager_0", "dir": "down", "lines": ["Ramen Summit stays warm even in blizzard season thanks to the giant tonkotsu kettles bubbling in every shop.", "Alkaline kansui water is what gives ramen noodles their yellow hue and springy bite in hot broth.", "A soft-boiled ajitsuke tamago needs exactly six minutes and thirty seconds before plunging into an ice bath."], "nightLines": ["Tap the rounded bottom of an egg gently with a spoon to pierce the air pocket so it peels cleanly after boiling."]}, {"id": "npc_ramen_summit_2", "x": 18, "y": 9, "name": "Botanist Wren", "sprite": "villager_1", "dir": "up", "lines": ["Chashu pork belly rolled in butcher's twine and braised in soy, mirin, and charred scallion melts on contact.", "Chili Courier Rico runs up the mountain switchbacks carrying ceramic jars of fermented chili crisp strapped to his pack.", "Wok Volcano's caldera radiates enough dry heat that cast-iron woks season themselves just sitting on the rim."], "nightLines": ["True wok hei happens when microscopic oil droplets vaporize in the flame as you toss rice noodles through the air."]}, {"id": "npc_ramen_summit_3", "x": 3, "y": 12, "name": "Angler Saul", "sprite": "villager_2", "dir": "left", "lines": ["If your ngmyeon black bean paste must be fried in pork fat with diced onions until the bitterness turns into rich caramel.", "Julienne cucumber on top of hot black bean noodles gives you a cool crunch in every mouthful."], "nightLines": ["Japchae sweet potato glass noodles are stir-fried with sesame oil and each vegetable is cooked separately by color."]}, {"id": "npc_chowder_crossing_1", "x": 21, "y": 6, "name": "Botanist Milo", "sprite": "villager_1", "dir": "up", "lines": ["Cold sesame noodles dressed with tahini, black vinegar, and grated cucumber are the best trail lunch on the ridge.", "Pappardelle ribbons cut an inch wide are built for wild boar or mushroom ragu, not timid butter sauces.", "Bucatini looks like thick spaghetti until you notice the pinhole down the center that whistles when you slurp."], "nightLines": ["Orecchiette--little ears--are shaped by dragging a butter knife across a dime of semolina dough and inverting it on your thumb."]}, {"id": "npc_chowder_crossing_2", "x": 26, "y": 9, "name": "Angler Jude", "sprite": "villager_2", "dir": "left", "lines": ["Charred broccoli rabe and garlic oil cling to the cup of an orecchiette like they were made for each other.", "Spaetzle batter scraped through a perforated colander into simmering water cooks in the time it takes to float.", "Pan-frying boiled spaetzle in brown butter with gruyere and crispy onions is how mountain climbers refuel."], "nightLines": ["Sweet noodle kugel baked with cottage cheese, sour cream, raisins, and cinnamon crust smells like a holiday."]}, {"id": "npc_chowder_crossing_3", "x": 17, "y": 12, "name": "Poet Rosa", "sprite": "villager_3", "dir": "right", "lines": ["Savory potato or noodle kugel baked in a cast-iron skillet gets lacy caramelized edges that crunch like chips.", "Fideua swaps paella rice for short toasted vermicelli noodles cooked flat in an iron pan with cuttlefish and saffron.", "Toasting dry short noodles in olive oil before adding fish stock gives fideua a nutty aroma a  a smoky griddle glaze."], "nightLines": ["Pickled red ginger--beni shoga--on the side of yakisoba cuts right through the rich pork belly."]}, {"id": "npc_simmer_fen_1", "x": 4, "y": 5, "name": "Angler Otto", "sprite": "villager_2", "dir": "left", "lines": ["Hand-pulled biangbiang noodles are wide as a belt and slapped against the wooden counter until they sing.", "Pouring smoking-hot rapeseed oil over raw minced garlic, chili flakes, and scallions on top of wide noodles is pure theater.", "Somen noodles are stretched on two rods and aged through a winter freeze so they cook in ninety seconds flat."], "nightLines": ["Catching cold somen noodles with chopsticks as they slide down a split bamboo water flume is a summer sport."]}, {"id": "npc_simmer_fen_2", "x": 9, "y": 8, "name": "Poet Ruby", "sprite": "villager_3", "dir": "right", "lines": ["Hiyashi chuka chilled ramen arranged with ribbons of egg crepe, cucumber, ham, and mustard-vinegar tare is art on a plate.", "Penne rigate have diagonal cut ends that scoop up arrabbiata chili sauce like fountain pen nibs.", "Amatriciana sauce needs cured pork cheek, Pecorino Romano, San Marzano tomatoes, and a whisper of white wine."], "nightLines": ["Never break dry spaghetti in half before dropping it in the pot; give it thirty seconds and swirl it down whole."]}, {"id": "npc_simmer_fen_3", "x": 25, "y": 10, "name": "Courier Kipp", "sprite": "villager_4", "dir": "down", "lines": ["Salt your pasta water until it tastes like a gentle summer wave in Steambay.", "Tagliatelle dimensions are officially registered in a gold-plated model at the chamber of commerce: eight millimeters flat.", "Tortelloni are the bigger cousins of tortellini, stuffed with ricotta and parsley and dressed in sage butter."], "nightLines": ["Trofie twists from the coast look like wood shavings and trap basil pesto in their tight spirals."]}, {"id": "npc_simmer_fen_4", "x": 12, "y": 13, "name": "Mason Mei", "sprite": "villager_5", "dir": "up", "lines": ["Boil r Vane: Here is the vintage Sparkling Stock list for Banquet Steward Otto in the Eternal Pantry!"]}, {"id": "npc_bisque_bastion_0", "x": 28, "y": 2, "name": "Poet Iris", "sprite": "villager_3", "dir": "right", "lines": ["Chowder Crossing is built on cedar stilts over warm mineral springs that smell faintly of bay leaf and celery seed.", "New England clam chowder should be thickened with crushed oyster crackers or salt pork roux, never cornstarch.", "Manhattan clam chowder uses tomatoes and thyme instead of cream, which still sparks polite debates at the inn."], "nightLines": ["Alchemist Bisque roasts lobster shells with tomato paste and brandy before simmering them into velvet stock."]}, {"id": "npc_bisque_bastion_1", "x": 19, "y": 7, "name": "Courier Ezra", "sprite": "villager_4", "dir": "down", "lines": ["Traditionally, bisque was thickened by pounding cooked rice and toasted crustacean shells together in a mortar.", "To clarify a cloudy consomme, whisk egg whites and minced mirepoix into cold stock and let the raft rise undisturbed.", "Poke a small breathing hole in the center of the egg-white raft so the consomme bubbles gently through the filter."], "nightLines": ["If you let a consomme boil hard after the raft forms, the proteins emulsify and cloud the whole pot."]}, {"id": "npc_bisque_bastion_2", "x": 27, "y": 10, "name": "Mason Zara", "sprite": "villager_5", "dir": "up", "lines": ["Miso paste must be stirred in after you turn off the flame; boiling kills the delicate fermented aroma.", "Red aka miso aged for two winters stands up to hearty root vegetables, while sweet white shiro miso loves spring tofu.", "Gazpacho tastes best when the cucumbers, tomatoes, and bell peppers marinate overnight with sherry vinegar and stale bread."], "nightLines": ["Emulsifying extra-virgin olive oil into gazpacho at the very end turns it from cold vegetable juice into coral velvet."]}, {"id": "npc_bisque_bastion_3", "x": 4, "y": 13, "name": "Herbalist Clara", "sprite": "villager_6", "dir": "left", "lines": ["Salmorejo is gazpacho's thicker Andalusian cousin, crowned with diced jamon serrano and grated hard-boiled egg.", "Simmer Fen's peat bogs bubble with geothermal warmth, keeping the wild watercress green all winter.", "French onion soup takes four pounds of yellow onions cooked down to two cups of dark amber jam before the beef stock goes in."], "nightLines": ["Deglazing the onion pot three times with water or dry white wine lifts the browned fond without scorching."]}, {"id": "npc_bisque_bastion_4", "x": 20, "y": 15, "name": "Brewer Vera", "sprite": "villager_7", "dir": "right", "lines": ["A Gruyere crouton broiled atop an earthenware crock of onion soup forms a seal that traps the thyme steam underneath.", "Borscht gets its ruby glow from grated beets simmered with a splash of vinegar to lock in the color.", "Stirring a spoonful of cold sour cream and fresh chopped dill into hot borscht turns the broth neon pink."], "nightLines": ["Gumbo starts with a dark chocolate-colored roux stirred non-stop for forty-five minutes without burning a single speck."]}], "signs": [{"x": 3, "y": 9, "text": "West: Broth Catacombs"}, {"x": 32, "y": 9, "text": "East: Chrome Fork HQ"}]}, "grand_tasting_hall": {"id": "grand_tasting_hall", "name": "Grand Tasting Hall", "region": "TastingHall", "music": "town_broth", "w": 28, "h": 22, "dark": false, "wildPool": [], "grid": [60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 59, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 58, 58, 58, 58, 58, 58, 58, 58, 58, 58, 59, 59, 59, 59, 59, 59, 58, 58, 58, 58, 58, 58, 58, 58, 58, 58, 60, 60, 58, 58, 58, 58, 58, 58, 58, 58, 58, 58, 59, 59, 59, 59, 59, 59, 58, 58, 58, 58, 58, 58, 58, 58, 58, 58, 60, 60, 58, 60, 60, 60, 60, 60, 60, 58, 58, 58, 59, 59, 59, 59, 59, 59, 58, 58, 58, 60, 60, 60, 60, 60, 60, 58, 60, 60, 58, 60, 60, 60, 60, 60, 60, 58, 58, 58, 59, 59, 59, 59, 59, 59, 58, 58, 58, 60, 60, 60, 60, 60, 60, 58, 60, 60, 58, 60, 60, 60, 60, 60, 60, 58 illager_4", "dir": "down", "lines": ["The Holy Trinity of Cajun cooking--onion, celery, and green bell pepper--hits the hot roux to stop it from darkening further.", "File powder ground from dried sassafras leaves thickens gumbo right in the bowl; never boil file or it turns stringy.", "Okra sliced into rings and browned in a skillet loses its mucilage while keeping its earthy flavor for seafood gumbo."], "nightLines": ["Kettle Gorge's basalt walls funnel the steam from hot springs into towering white plumes visible from three miles away."]}, {"id": "npc_grand_tasting_hall_1", "x": 8, "y": 7, "name": "Mason Maya", "sprite": "villager_5", "dir": "up", "lines": ["The Perpetual Simmer pot in the gorge has been kept on a low bubble by rotating shifts of soup tenders for eighty years.", "Vichyssoise is proof that leeks, potatoes, and cream are just as noble chilled in crystal bowls as they are hot.", "Always wash sliced leeks in a bowl of cold water and lift them out so the sandy grit sinks to the bottom."], "nightLines": ["Avgolemono soup relies on tempering hot chicken broth into whisked egg and lemon juice one ladle at a time."]}, {"id": "npc_grand_tasting_hall_2", "x": 19, "y": 10, "name": "Herbalist Paco", "sprite": "villager_6", "dir": "left", "lines": ["Bisque Bastion's stone ramparts were mortared during the Great Soup Truce and smell wonderfully of rosemary.", "Lady Bouillon guards the Deep Stock Vault, where vintage reductions are aged in stoneware crocks sealed with clarified butter.", "Oxtail soup rewards cooks who skim the foam during the first half hour and then leave the lid alone until sundown."], "nightLines": ["Roasting beef bones with a smear of tomato paste before they go into the stockpot builds deep mahogany color."]}, {"id": "npc_grand_tasting_hall_3", "x": 2, "y": 15, "name": "Brewer Wren", "sprite": "villager_7", "dir": "right", "lines": ["Always start stock with cold water; starting with boiling water coagulates surface proteins and traps flavor nted beeswax so soot never taints the aging stock barrels."], "nightLines": ["Mulligatawny soup blends curry spices, tart diced apples, red lentils, and coconut milk into a warming bowl."]}, {"id": "npc_eternal_pantry_1", "x": 27, "y": 4, "name": "Herbalist Boyd", "sprite": "villager_6", "dir": "left", "lines": ["Cock-a-leekie soup pairs slow-simmered chicken and sweet leeks with barley and julienned prunes.", "Bouillabaisse fishermen originally boiled the bony rockfish they couldn't sell at market with saffron, fennel, and orange peel.", "Rouille garlic-saffron mayonnaise spread on toasted baguette rounds melts into bouillabaisse like sunshine."], "nightLines": ["Congee rice porridge cooked for three hours with a piece of ginger and a century egg is the gentlest breakfast on earth."]}, {"id": "npc_eternal_pantry_2", "x": 4, "y": 7, "name": "Brewer Milo", "sprite": "villager_7", "dir": "right", "lines": ["Stirring congee in one direction during the last ten minutes breaks the rice grains open into creamy clouds.", "Topping plain congee with crispy fried youtiao dough sticks, scallions, and white pepper is mandatory on rainy mornings.", "Kimchi jjigae tastes best when the kimchi in your crock is at least three months old and pleasantly fizzy."], "nightLines": ["Simmering kimchi with pork belly and anchovy-kelp stock turns the tofu cubes inside into flavor bombs."]}, {"id": "npc_eternal_pantry_3", "x": 19, "y": 9, "name": "Chef Jude", "sprite": "villager_8", "dir": "down", "lines": ["Sundubu jjigae uses uncurdled silken tofu scooped warm into a glowing red stone pot with a raw egg cracked on top.", "Doenjang jjigae fermented soybean stew has an earthy depth that anchors any meal after a long hike.", "Sichuan mala hotpot divides the cauldron in half with a metal yin-yang wall--clear bone broth on one side, tallow chili on the other."], "nightLines": ["Swishing paper-thin lamb slices in boiling hotpot broth for seven seconds keeps them tender."]}, {"id": "npc_eternal_pa 5, 5, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21], "portals": [{"x": 6, "y": 4, "to": "sourdough_cavern", "tx": 6, "ty": 4}], "npcs": [{"id": "starter_jar", "x": 12, "y": 8, "name": "Ancient Starter Jar", "sprite": "item_chest", "dir": "down", "questComplete": "q5_starter", "notStartedLines": ["An ancient sourdough crock. You should speak with the Yeast Monk in Panini Plaza before touching it!"], "notReadyLines": ["You haven't checked in with Starter Keeper Orin on Sourdough Cavern 1F yet!"], "lines": ["The 100-year starter bubbles happily! Learned Recipe: Aged Cheddar + 400G!"]}, {"id": "yeast_block", "x": 10, "y": 8, "name": "Sourdough Cask", "sprite": "push_block", "dir": "down", "pushable": true, "lines": ["A heavy oak sourdough cask."]}, {"id": "sec_sourdough_jar", "x": 19, "y": 10, "name": "Sparkling Spot", "sprite": "item_chest", "dir": "down", "secretId": "sec_sourdough_jar", "lines": ["Found 100-Year Starter Vial (1x Garnish Treat)!"]}, {"id": "npc_sourdough_cavern_b2_0", "x": 14, "y": 3, "name": "Brewer Talia", "sprite": "villager_7", "dir": "right", "lines": ["Dipping a corner of a cheddar grilled cheese into hot tomato basil soup is a foundational childhood memory.", "Cheddar beer soup made with a malty amber ale and dry mustard needs warm soft pretzels for dunking.", "Broccoli cheddar soup should have tender florets chopped small enough to fit on a soup spoon without splashing."], "nightLines": ["Corn chowder gets twice the flavor when you scrape the bare cobs with the back of your knife and simmer them in the milk."]}, {"id": "npc_sourdough_cavern_b2_1", "x": 8, "y": 5, "name": "Chef Nora", "sprite": "villager_8", "dir": "down", "lines": ["Smoked paprika--pimenton de la Vera--gives potato leek soup a campfire warmth without needing meat.", "Chilled cucumber yogurt soup--tarator--with crushed walnuts, garlic, and dill is summer in a bowl.", "Chilled sour cherry soup from Hungary uses cinnamon, cloves, and a dollop of sour cream as a starter course."], "nightLines": ["Miso-tahini ramen broth blends Japanese and Mediterranean pantry staples into instant creamy umami."]}, {"id": "npc_sourdough_cavern_b2_2", "x": 7, "y": 7, "name": "Baker Lena", "sprite": "villager_9", "dir": "up", "lines": ["Mushroom barley soup made with dried porcini soaking liquid tastes like an ancient forest after rain.", "Always strain dried mushroom soaking broth through a coffee filter to catch the tiny specks of forest sand.", "Chicken noodle soup needs wide egg noodles cooked in a separate pot so they don't drink up all the golden broth in the fridge."], "nightLines": ["Drop a whole unpeeled yellow onion into your chicken stock; the papery skin dyes the broth a rich amber gold."]}, {"id": "npc_sourdough_cavern_b2_3", "x": 6, "y": 9, "name": "Taster Ivan", "sprite": "villager_10", "dir": "left", "lines": ["Bouquet garni--parsley stems, thyme sprigs, and a bay leaf tied in leek green--can be fished out with one tug of string.", "Sachet d'epices wraps peppercorns, cloves, and garlic in cheesecloth so nobody bites into a whole clove.", "Skimming fat off cold stock is easy when it solidifies into a neat white cap overnight in the icebox."], "nightLines": ["Glace de viande is stock reduced to one-tenth its volume until it cools into a rubbery puck of pure savory power."]}, {"id": "npc_sourdough_cavern_b2_4", "x": 11, "y": 12, "name": "Botanist Nadia", "sprite": "villager_11", "dir": "right", "lines": ["One teaspoon of meat glaze dissolved in hot water with butter creates an instant pan sauce.", "Court bouillon--water simmered with white wine, lemon, mirepoix, and peppercorns--poaches delicate fish in ten minutes.", "Dashi ichiban is the first gentle infusion for clear soup; dashi niban simmers the kelp and flakes a second time for stews."], "nightLines": ["Ochazuke pours hot green sencha or dashi over leftover rice with flaked salmon, nori, and rice crackers."]}], "signs": []}, "steamer_spir  plus-two, Spicy, Fried, and Toasted moves hit twenty-five percent harder."], "nightLines": ["At Chilled minus-two, Chilled, Raw, and Pickled techniques gain a twenty-five percent edge while Spicy moves cool off."]}, {"id": "npc_steamer_spire_3", "x": 14, "y": 9, "name": "Botanist Zara", "sprite": "villager_11", "dir": "right", "lines": ["Flavor Combos trigger when the same bEATst follows one cooking type with a complementary type on the next turn.", "Following a Toasted move with a Savory move triggers the Umami Melt combo for bonus damage and a ten-percent heal.", "Chaining Spicy into Sweet creates the Hot Honey Glaze combo, which hits thirty-five percent harder and restores health."], "nightLines": ["Steamed followed by Brothy triggers Soup Dumpling Burst--Master Baozi's signature two-turn sequence."]}, {"id": "npc_steamer_spire_4", "x": 17, "y": 11, "name": "Angler Clara", "sprite": "villager_0", "dir": "down", "lines": ["Fried into Pickled fires the Crispy Tang Cut combo; acid always balances oil in a well-run kitchen.", "Fermented followed by Toasted triggers Sourdough Crunch, my personal favorite Breadlands finisher.", "Chilled into Sweet creates Gelato Swirl, which heals fifteen percent of your bEATst's maximum HP on impact."], "nightLines": ["Herbal followed by Brothy activates Aromatic Simmer, filling the whole battlefield with thyme and bay leaf steam."]}], "signs": []}, "steamer_spire_f2": {"id": "steamer_spire_f2", "name": "Steamer Spire 2F", "region": "Steambay", "music": "overworld_steam", "w": 24, "h": 17, "dark": false, "wildPool": [[74, 23, 27], [75, 23, 27], [76, 25, 29], [40, 16, 20], [43, 20, 24], [45, 22, 25], [47, 24, 27], [49, 21, 24], [51, 23, 26], [53, 23, 26], [55, 18, 22]], "grid": [33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 33, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 33, 33, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, , "y": 6, "name": "Baker Gus", "sprite": "villager_9", "dir": "up", "lines": ["Raw into Pickled triggers Ceviche Zing--citrus brine curing fresh ingredients right in the middle of a turn.", "Each of the twelve cooking types has a teachable Recipe Card you can buy at regional Pantry Marts or earn from quests.", "Teaching a bEATst a fourth move is easy, and when it learns a fifth you can pick which old recipe to retire."], "nightLines": ["Switching bEATsts mid-battle works against wild dishes just as smoothly as it does against Head Chefs."]}, {"id": "npc_steamer_spire_f2_1", "x": 16, "y": 7, "name": "Taster Arlo", "sprite": "villager_10", "dir": "left", "lines": ["If your lead bEATst is weak to Pickled moves, open the PARTY tab in battle and send in a Sweet or Spicy partner.", "Sizzling status singes a bEATst with pan heat, while Brined slows down careless footwork.", "Drowsy happens after a heavy carb course--keep Peppermint Tea or a Double Espresso in your bag."], "nightLines": ["Warm Broth Cups heal twenty-five HP and cost only forty gold, making them the workhorse of Toastwood Trail."]}, {"id": "npc_steamer_spire_f2_2", "x": 5, "y": 10, "name": "Botanist Maya", "sprite": "villager_11", "dir": "right", "lines": ["Hearty Stew restores sixty-five HP and can be cooked for free at the Cruston bEATst Cafe if you bring a Broth Cup and Garnish Treat.", "Grand Feasts restore full health and clear any kitchen status in a single course.", "Your Copper Soup Ladle lets you press A while facing any pond, river, harbor, or stock pool to ladle up wild bEATsts."], "nightLines": ["The Kitchen Lantern automatically illuminates a safe circle around you in dark caverns and the Cauldron Conservatory."]}, {"id": "npc_steamer_spire_f2_3", "x": 14, "y": 11, "name": "Angler Paco", "sprite": "villager_0", "dir": "down", "lines": ["Inns never charge a single coin--every Simmer Inn keeper heals your full party's HP and move PP with a smile.", "If all six of your party bEATsts faint, you'll dash back to Cruston Town with your party rested and your gold intact.", "Your storage Box holds every extra bEATst you plate once your six-slot party is full."], "nightLines": ["Visiting the bEATst Cafe in Cruston Town lets you check on the dishes relaxing in your storage Box."]}, {"id": "npc_steamer_spire_f2_4", "x": 17, "y": 12, "name": "Poet Wren", "sprite": "villager_1", "dir": "up", "lines": ["Saving your game in any of the three slots writes to local storage and lets you export a JSON backup file anytime.", "Every evolution line in Pantrylia learns eight moves by level-up, starting from basic kitchen taps up to signature feasts.", "Crustling evolves into Paninipup at level sixteen, and then into the towering Clubbehemoth at level thirty-two."], "nightLines": ["Doughbit evolves into Baobouncer at sixteen and reaches Steamlord at thirty-two with clouds of fragrant steam."]}], "signs": []}, "wok_volcano": {"id": "wok_volcano", "name": "Wok Volcano 1F", "region": "Noodleridge", "music": "overworld_noodle", "w": 29, "h": 18, "dark": false, "wildPool": [[108, 33, 37], [109, 33, 37], [110, 33, 37], [111, 34, 38], [112, 34, 38], [113, 34, 38], [114, 36, 40]], "grid": [45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 45, 45, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 37, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 37, 37, 45, 45, 37, 37, 37, 44, 44, 44, 44, 44, 44, 37, 37, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 37, 37, 45, 45, 37, 37, 37, 44, 44, 6, 44, 44, 44, 37, 37, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 37, 37, 45, 45, 37, 37, 37, 44, 44, 44, 44, 44, 44, 37, 37, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 37, 37, 45, 45, 37, 37, 37, 44, 44, 44, 44, 44, 44, 37, 37, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 37, 37, 45, 45, volcano_1", "x": 4, "y": 6, "name": "Botanist Cleo", "sprite": "villager_11", "dir": "right", "lines": ["Carry a spare Royal Banquet Setting if you ever unlock the Secret Pantry Door, because Consommyth has refined taste.", "Completing all 151 entries in the bEATdex earns a special diploma from Chef Brotholomew himself.", "Sparkling spots hidden in corners of towns and dungeons hold secret caches of plates, treats, and gold."], "nightLines": ["Pushing dough boulders or sourdough casks only works if the tile behind the block is clear floor."]}, {"id": "npc_wok_volcano_2", "x": 15, "y": 8, "name": "Angler Boyd", "sprite": "villager_0", "dir": "down", "lines": ["Stepping on a golden floor switch drops every red laser gate on that map for the rest of your adventure.", "Conveyor belts and spilled sesame oil slide you until you hit dry floor, so line up your approach first.", "Chrome Fork Syndicate agents wear clip-on ties that double as thermometers for checking corporate compliance."], "nightLines": ["I asked a Syndicate grunt why their logo is a three-pronged fork, and he said the fourth tine was cut in the Q3 budget."]}, {"id": "npc_wok_volcano_3", "x": 12, "y": 10, "name": "Poet Milo", "sprite": "villager_1", "dir": "up", "lines": ["Beige Plate Corp's flagship product was 'Nutrient Loaf #4', which tasted like an envelope you licked twice.", "Auditor Vesper tried to cite my grandmother's marinara for 'unregistered oregano variance' last Tuesday.", "Director Crumb carries a briefcase full of styrofoam takeout clamshells and calls it 'packaging innovation'."], "nightLines": ["VP Synergy Glaze speaks entirely in slide-deck bullet points even when ordering a cup of tea."]}, {"id": "npc_wok_volcano_4", "x": 21, "y": 12, "name": "Courier Jude", "sprite": "villager_2", "dir": "left", "lines": ["CEO Sterling Ladle's executive suite had a laser gate solely because he kept forgetting where he put his office key.", "Now that Sterling Ladle runs a soup cart in the Eternal Pantry, he actually uses real carrots and smiles for free.", "Rival Saffron used to weigh her salt on a jeweler's scale before she realized a pinch from the heart tastes better."], "nightLines": ["Saffron's notebook has color-coded tabs for every battle she lost to you, plus a sketch of her starter smiling."]}], "signs": []}, "wok_volcano_f2": {"id": "wok_volcano_f2", "name": "Wok Volcano Crater", "region": "Noodleridge", "music": "overworld_noodle", "w": 25, "h": 16, "dark": false, "wildPool": [[112, 34, 38], [113, 34, 38], [114, 36, 40], [78, 16, 22], [81, 18, 24], [83, 21, 26], [85, 24, 28], [87, 22, 27], [89, 20, 26], [91, 24, 28], [93, 21, 26]], "grid": [45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 45, 45, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 66, 45, 45, 66, 66, 66, 44, 44, 44, 44, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 66, 66, 66, 66, 45, 45, 66, 66, 66, 44, 44, 7, 44, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 66, 66, 66, 66, 45, 45, 66, 66, 66, 44, 44, 44, 44, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 66, 66, 66, 66, 45, 45, 66, 66, 66, 36, 36, 36, 36, 66, 66, 66, 66, 66, 66, 66, 44, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 36, 36, 36, 36, 66, 66, 66, 66, 66, 66, 66, 66, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 36, 36, 36, 36, 66, 66, 45, 45, 45, 45, 66, 66, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 36, 36, 36, 36, 66, 66, 45, 45, 45, 45, 66, 66, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 36, 36, 36, 36, 66, 66, 45, 45, 45, 45, 66, 66, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 36, 36, 36, 36, 66, 66, 66, 66, 66, 66, 66, 66, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 44, 66, 66, 66, 66, 45, 45, 66, 66, 66, 44, 44, 44, 44, 44, 44, ove."]}, {"id": "npc_wok_volcano_f2_2", "x": 18, "y": 10, "name": "Poet Yuki", "sprite": "villager_1", "dir": "up", "lines": ["Tea Master Po's teapot has never been washed with soap in forty years--only rinsed with boiling spring water.", "Chili Courier Rico wears asbestos-lined oven mitts even in July because his five-alarm chili jars radiate heat.", "My neighbor tried to plate a wild Sourdoughon with a Paper Plate and the loaf simply ate the plate."], "nightLines": ["I keep finding sesame seeds in my keyboard and honestly they improve the tactile click of the spacebar."]}, {"id": "npc_wok_volcano_f2_3", "x": 9, "y": 12, "name": "Courier Otto", "sprite": "villager_2", "dir": "left", "lines": ["Never challenge a Noodleridge chef to a staring contest; they spend all day watching pots wait to boil.", "My uncle insists that cast-iron pans have memories, and his skillet still remembers a burnt pancake from 1998.", "If a recipe says 'caramelize the onions in ten minutes', the author is lying to you and should not be trusted."], "nightLines": ["Two cloves of garlic in a recipe is just a polite suggestion; five cloves is where the conversation begins."]}, {"id": "npc_wok_volcano_f2_4", "x": 8, "y": 13, "name": "Mason Ruby", "sprite": "villager_3", "dir": "right", "lines": ["Measuring vanilla extract with the cap of the bottle is a rite of passage in every home bakery.", "When a soup needs 'something' at the end, ninety percent of the time that something is a teaspoon of vinegar or lemon juice.", "Salt doesn't make food taste salty when used right; it makes tomatoes taste more like tomatoes."], "nightLines": ["Cold butter whisked into a hot pan sauce off the burner--monter au beurre--gives it a mirror gloss."]}], "signs": []}, "broth_catacombs": {"id": "broth_catacombs", "name": "Broth Catacombs 1F", "region": "Brothbasin", "music": "overworld_broth", "w": 28, "h": 18, "dark": false, "wildPool": [[145, 42, 46], [146, 42, 46], [147, 43, 47], [148, 43, 47], [149, 44, 48], [15 dir": "right", "lines": ["Fresh nutmeg grated over bechamel or spinach smells like warm cedar and clove.", "Saffron threads steeped in two tablespoons of warm water for twenty minutes release their full golden sunset.", "Vanilla beans split lengthwise and scraped into custard can be dried afterwards and buried in a jar of sugar."], "nightLines": ["Brown butter--beurre noisette--happens in the thirty seconds between 'foaming yellow' and 'uh oh, burnt'; stay by the stove."]}, {"id": "npc_broth_catacombs_4", "x": 17, "y": 12, "name": "Herbalist Ivan", "sprite": "villager_4", "dir": "down", "lines": ["Deglazing a roast pan with stock and scraping the brown bits with a wooden spoon is where gravy comes from.", "Resting a roast or a thick panini for five minutes lets the juices settle instead of running all over the board.", "Taste your dish with a clean spoon at every step--seasoning at the end only salts the surface."], "nightLines": ["Cooking for friends is the one magic spell that works every single time you cast it."]}], "signs": []}, "broth_catacombs_b2": {"id": "broth_catacombs_b2", "name": "Broth Catacombs B2", "region": "Brothbasin", "music": "overworld_broth", "w": 24, "h": 16, "dark": true, "wildPool": [[148, 43, 47], [149, 44, 48], [150, 45, 50], [116, 16, 24], [119, 19, 26], [121, 21, 27], [123, 23, 29], [125, 20, 27], [127, 24, 30], [129, 24, 30]], "grid": [57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 57, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 57, 57, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 53, 57, 57, 53, 53, 53, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 53, 53, 53, 57, 57, 53, 53, 53, 56, 56, 6, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 53, 53, 53, 57, 57, 53, 53, 53, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 56, 53, 53, 53, 57, 57, 53, 53, 53, 53, 56, 56, 56, 56, 4 chens as soon as dusk settles.", "Even at midnight, you can hear the conveyor belts in The Toaster Hearth clacking away."], "nightLines": ["Down in Sourdough Cavern, day and night feel the same, though the yeast bubbles faster when the moon is full."]}, {"id": "npc_broth_catacombs_b2_2", "x": 17, "y": 9, "name": "Mason Iris", "sprite": "villager_3", "dir": "right", "lines": ["Truffle Cellar's mushrooms release their spores after sundown, filling the stairs with earthy perfume.", "Bao Harbor's water reflects the red steamer lanterns like a hundred floating rubies.", "Night fishermen in Steambay keep warm by tucking a steamed pork bun inside their oilskin coats."], "nightLines": ["Bamboo Mist Path turns silver under the moonlight, and the mist clings low around your ankles."]}, {"id": "npc_broth_catacombs_b2_3", "x": 9, "y": 11, "name": "Herbalist Ezra", "sprite": "villager_4", "dir": "down", "lines": ["Moonbun only comes out in Gyoza Cove when the tide is high and the stars are out.", "Listening to the waves slap against Pierogi Pier at night makes me crave hot potato dumplings.", "From the top of Steamer Spire at night, you can see the lighthouse beam sweeping across all of Steambay."], "nightLines": ["Udon Hollow's waterwheels creak softly in the dark while the morning dough rests under damp cloths."]}, {"id": "npc_broth_catacombs_b2_4", "x": 15, "y": 12, "name": "Brewer Zara", "sprite": "villager_5", "dir": "up", "lines": ["Slurp Canyon's rope bridges look like silver threads strung between the cliffs by moonlight.", "Midniteramen prowls Al Dente Ascent after sunset, drawn to the scent of simmering miso.", "At the top of Ramen Summit, the stars look close enough to scoop up with a porcelain ladle."], "nightLines": ["Wok Volcano's crater glows cherry-red against the night sky like a giant charcoal brazier."]}], "signs": []}, "chrome_fork_hq": {"id": "chrome_fork_hq", "name": "Chrome Fork HQ 1F", "region": "Brothbasin", "music": "battle_rival", "w": 28, "h": 18, "da  Fen's wooden duckboards keep your boots dry above the bubbling peat.", "The lost Copper Ladle in Simmer Fen still shines because the mineral water prevents tarnish.", "Kettle Gorge's Perpetual Valve regulates the steam pressure for every kitchen in Brothbasin."], "nightLines": ["Bisque Bastion's heavy stone walls kept the soup recipes safe when Chrome Fork tried to audit the region."]}, {"id": "npc_truffle_cellar_b2_3", "x": 16, "y": 12, "name": "Taster Nora", "sprite": "villager_8", "dir": "down", "lines": ["The Deep Stock Vault requires flipping the southeast floor switch before the vault gate opens.", "Sous-Chef Consomme polishes the vault ladles until you can see your face in the bowl.", "Broth Catacombs' upper crypts are lined with bay-leaf wreaths, and the lower vault is dark and gated."], "nightLines": ["Chrome Fork HQ's first floor has a corporate conveyor belt designed to usher visitors past the reception desk."]}, {"id": "npc_truffle_cellar_b2_4", "x": 19, "y": 13, "name": "Botanist Lena", "sprite": "villager_9", "dir": "up", "lines": ["On Chrome Fork HQ's executive suite, Rival Saffron holds off the security detail while you hit the corner switch.", "Grand Tasting Hall's red carpet runs straight through three Master Tasters to Champion Chef Aurelia's table.", "Banquet Prep Chef in the Grand Hall offers free full restores so you can challenge the gauntlet at full strength."], "nightLines": ["Eternal Pantry's crystal meadows host fully evolved bEATsts from all four food families at level fifty-plus."]}], "signs": []}, "gym_toaster": {"id": "gym_toaster", "name": "The Toaster Hearth", "region": "Breadlands", "music": "town_bread", "w": 22, "h": 15, "dark": false, "wildPool": [], "grid": [15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 67, 15, 15, 67, 16, 16, 16, 16, 16, 16, 67, 17, 17, 17, 17, 17, 16, 16, 16, 16, 16, 16, 67, 15, 15, 67, 16 // Repeat and transpose musical phrases to build full 45-55s multi-section GBA tracks
function buildPhraseTrack(bpm, loop, p1Phrases, p2Phrases, wvPhrases, nsPhrases) {
  const expand = (phrases, shifts) => {
    const out = [];
    for (let i = 0; i < shifts.length; i++) {
      const sh = shifts[i];
      const ph = phrases[i % phrases.length];
      for (const [m, d] of ph) out.push([m > 0 ? m + sh : 0, d]);
    }
    return out;
  };
  const shifts = [0, 0, 2, 0, 5, 4, 2, 0, -2, 0, 5, 7, 5, 4, 2, 0];
  return {
    bpm, loop,
    pulse1: expand(p1Phrases, shifts),
    pulse2: expand(p2Phrases, shifts),
    wave:   expand(wvPhrases, shifts),
    noise:  expand(nsPhrases, Array(shifts.length).fill(0))
  };
}

function renderSequenceOffline(seq, sampleRate = 22050) {
  const stepSec = 60 / (seq.bpm || 120) / 2;
  const countSteps = arr => (arr || []).reduce((s, n) => s + n[1], 0);
  const totalSteps = Math.max(
    1,
    countSteps(seq.pulse1), countSteps(seq.pulse2), countSteps(seq.wave), countSteps(seq.noise)
  );
  const totalSamples = Math.max(1, Math.floor(totalSteps * stepSec * sampleRate));
  const out = new Float32Array(totalSamples);

  function renderPulse(notes, duty, amp) {
    if (!notes || !notes.length) return;
    let t = 0;
    for (const [midi, dur] of notes) {
      const start = Math.floor(t * stepSec * sampleRate);
      const end = Math.min(totalSamples, Math.floor((t + dur) * stepSec * sampleRate));
      if (midi > 0) {
        const hz = midiToHz(midi);
        const period = sampleRate / hz;
        for (let i = start; i < end; i++) {
          const ph = (i % period) / period;
          const env = 1 - ((i - start) / Math.max(1, end - start)) * 0.35;
          out[i] += (ph < duty ? 1 : -1) * amp * env;
        }
      }
      t += dur;
    }
  }

  function renderWave(notes, amp) {
    if (!notes || !notes.length) return;
    let t = 0;
    for (const [midi, dur] of notes) {
      const start = Math.floor(t * stepSec * sampleRate);
      const end = Math.min(totalSamples, Math.floor((t + dur) * stepSec * sampleRate));
      if (midi > 0) {
        const hz = midiToHz(midi);
        const period = sampleRate / hz;
        for (let i = start; i < end; i++) {
          const idx = Math.floor(((i % period) / period) * 32) & 31;
          const s = (GBA_WAVETABLE[idx] / 7.5) - 1;
          out[i] += s * amp;
        }
      }
      t += dur;
    }
  }

  function renderNoise(notes, amp) {
    if (!notes || !notes.length) return;
    let t = 0;
    let lfsr = 0x7FFF;
    for (const [on, dur] of notes) {
      const start = Math.floor(t * stepSec * sampleRate);
      const end = Math.min(totalSamples, Math.floor((t + dur) * stepSec * sampleRate));
      if (on > 0) {
        for (let i = start; i < end; i++) {
          if (i % 6 === 0) {
            const bit = ((lfsr >> 0) ^ (lfsr >> 1)) & 1;
            lfsr = (lfsr >> 1) | (bit << 14);
          }
          const env = Math.max(0, 1 - (i - start) / Math.max(1, (end - start) * 0.5));
          out[i] += ((lfsr & 1) ? 1 : -1) * amp * env;
        }
      }
      t += dur;
    }
  }

  renderPulse(seq.pulse1, 0.5, 0.18);
  renderPulse(seq.pulse2, 0.25, 0.12);
  renderWave(seq.wave, 0.18);
  renderNoise(seq.noise, 0.10);

  return {
    samples: out,
    durationSec: totalSamples / sampleRate,
    channelsUsed: AUDIO_CHANNELS.slice()
  };
}

function renderTrackOffline(trackId, sampleRate = 22050) {
  const tr = MUSIC_TRACKS[trackId];
  if (!tr) return null;
  return renderSequenceOffline(tr, sampleRate);
}

function renderSfxOffline(sfxId, sampleRate = 22050) {
  const sfx = SFX_DEFS[sfxId];
  if (!sfx) return null;
  return renderSequenceOffline(sfx, sampleRate);
}

const AudioEngine = {
  ctx: null,
  volume: 0.5,
  currentTrack: null,
  currentSource: null,
  muted: false,
  bufferCache: {},

  ensureCtx() {
    if (this.ctx) return this.ctx;
    try {
      const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
      if (AC) this.ctx = new AC();
    } catch (e) {}
    return this.ctx;
  },

  playMusic(trackId) {
    if (this.currentTrack === trackId) return;
    this.currentTrack = trackId;
    if (this.muted || this.volume <= 0) return;
    const ctx = this.ensureCtx();
    if (!ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      if (this.currentSource) { try { this.currentSource.stop(); } catch (e) {} }
      const rendered = this.bufferCache[trackId] || (this.bufferCache[trackId] = renderTrackOffline(trackId, 22050));
      if (!rendered) return;
      const buf = ctx.createBuffer(1, rendered.samples.length, 22050);
      buf.getChannelData(0).set(rendered.samples);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = !!MUSIC_TRACKS[trackId].loop;
      const gain = ctx.createGain();
      gain.gain.value = this.volume * 0.4;
      src.connect(gain);
      gain.connect(ctx.destination);
      src.start();
      this.currentSource = src;
    } catch (e) {}
  },

  playSfx(sfxId) {
    if (this.muted || this.volume <= 0) return;
    const ctx = this.ensureCtx();
    if (!ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      const rendered = renderSfxOffline(sfxId, 22050);
      if (!rendered) return;
      const buf = ctx.createBuffer(1, rendered.samples.length, 22050);
      buf.getChannelData(0).set(rendered.samples);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const gain = ctx.createGain();
      gain.gain.value = this.volume * 0.6;
      src.connect(gain);
      gain.connect(ctx.destination);
      src.start();
    } catch (e) {}
  }
};

const SAVE_KEY_PREFIX = 'beatsts_v2_slot_';

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function createBeatstInstance(speciesId, level, rngFn = Math.random) {
  const sp = BEATSTS_BY_ID[speciesId] || BEATSTS_BY_ID[1];
  const iv = Math.floor(rngFn() * 8);
  const calcStat = (base, isHp) => isHp
    ? Math.floor(((base + iv) * 2 * level) / 100) + level + 12
    : Math.floor(((base + iv) * 2 * level) / 100) + 6;
  const maxHp = calcStat(sp.stats.hp, true);
  // Pick up to 4 latest learned moves at or below `level`
  const avail = sp.learnset.filter(([lv]) => lv <= level).map(([, id]) => id);
  const chosen = (avail.length ? avail : sp.learnset.map(([, id]) => id)).slice(-4);
  const moves = chosen.map(mid => {
    const m = MOVES[mid] || MOVES[0];
    return { id: m.id, pp: m.pp, maxPp: m.pp };
  });
  return {
    uid: Math.floor(rngFn() * 1e9),
    speciesId: sp.id,
    nickname: sp.name,
    level,
    xp: level * level * 8,
    nextXp: (level + 1) * (level + 1) * 8,
    hp: maxHp,
    maxHp,
    atk: calcStat(sp.stats.atk, false),
    def: calcStat(sp.stats.def, false),
    spd: calcStat(sp.stats.spd, false),
    status: null,
    lastMoveType: null,
    moves
  };
}

function recalcStats(mon) {
  const sp = BEATSTS_BY_ID[mon.speciesId];
  const oldMax = mon.maxHp;
  const calcStat = (base, isHp) => isHp
    ? Math.floor((base * 2 * mon.level) / 100) + mon.level + 12
    : Math.floor((base * 2 * mon.level) / 100) + 6;
  mon.maxHp = calcStat(sp.stats.hp, true);
  mon.hp = Math.min(mon.maxHp, mon.hp + Math.max(0, mon.maxHp - oldMax));
  mon.atk = calcStat(sp.stats.atk, false);
  mon.def = calcStat(sp.stats.def, false);
  mon.spd = calcStat(sp.stats.spd, false);
  mon.nextXp = (mon.level + 1) * (mon.level + 1) * 8;
}

function safeStorageSet(key, val) {

      name: data.name || 'Brie',
